          description: cuid del mensaje de contacto
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      responses:
        "200":
          description: El mensaje de contacto pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensajeContacto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [Contacto]
      summary: Marca como leido o responde un mensaje de contacto
      description: |
        Actualizacion **parcial**: se manda solo lo que cambia (`estado` y/o
        `respuesta`). Hay que enviar al menos un campo, un body vacio es 400.

        Si se envia `respuesta` y el mensaje **todavia no tenia una respuesta
        previa**, se fija automaticamente `respondidoAt = now()` y
        `estado = RESPONDIDO`, sin importar que otro `estado` se haya mandado
        en el mismo body.

        **Requiere token con rol ADMIN.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del mensaje de contacto
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MensajeContactoUpdateInput" }
      responses:
        "200":
          description: El mensaje de contacto ya modificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MensajeContacto" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Contacto]
      summary: Elimina un mensaje de contacto
      description: |
        Eliminacion **fisica**: la fila se borra de la base (no hay soft
        delete en este modelo). Si no existe devuelve 404. Si se elimina
        correctamente devuelve 204 sin body.

        **Requiere token con rol ADMIN.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del mensaje de contacto
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      responses:
        "204":
          description: Eliminado. Sin body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /albums:
    get:
      tags: [Albums]
      summary: Lista los álbumes de fotos
      security:
        # Auth opcional: el endpoint es publico, pero si llega un token se usa
        # (lo necesita `incluirInactivos`). El `{}` es lo que lo marca como
        # opcional; sin la lista entera, Swagger UI NO manda el token aunque
        # hayas apretado Authorize, y el request sale anonimo.
        - {}
        - bearerAuth: []
      description: |
        Endpoint público. Devuelve **solo los álbumes activos**.

        Cada álbum viene con su **portada** y con `cantidadImagenes`, pero
        **no** con el array completo de fotos: para eso está el detalle. Listar
        30 álbumes de 40 fotos con todo adentro serían 1200 objetos que la
        grilla no muestra.

        Orden: primero por la fecha del evento (más reciente arriba) y después
        por fecha de carga. Los que no tienen fecha van al final.
      parameters:
        - name: incluirInactivos
          in: query
          required: false
          description: >-
            Con `true` incluye también los álbumes dados de baja. **Requiere
            token con rol ADMIN**: sin él, la respuesta es 403. Solo se aceptan
            los valores `true` y `false`; cualquier otro da 400.
          schema:
            type: string
            enum: ["true", "false"]
          example: "true"
      responses:
        "200":
          description: Listado de álbumes (array vacío si no hay ninguno)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Album" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [Albums]
      summary: Crea un álbum vacío
      description: |
        **Requiere token con rol ADMIN.**

        Crea solo los metadatos: las fotos se suben después con
        `POST /albums/{id}/imagenes`. El álbum nace **activo** y sin portada.

        El `slug` se genera a partir del título y no se puede elegir. Si el
        título se repite, se agrega un sufijo (`-2`, `-3`, ...). El autor sale
        del token, nunca del body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumInput" }
      responses:
        "201":
          description: Álbum creado. El header `Location` apunta al recurso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /albums/{id}:
    get:
      tags: [Albums]
      summary: Obtiene un álbum con todas sus fotos
      security:
        # Auth opcional: el endpoint es publico, pero si llega un token se usa
        # (lo necesita `incluirInactivos`). El `{}` es lo que lo marca como
        # opcional; sin la lista entera, Swagger UI NO manda el token aunque
        # hayas apretado Authorize, y el request sale anonimo.
        - {}
        - bearerAuth: []
      description: |
        Endpoint público. A diferencia del listado, este **sí** trae el array
        completo de `imagenes`, ordenado por fecha de subida.

        Un álbum dado de baja **devuelve 404**, igual que si no existiera: un
        403 estaría confirmando que existe. Con `incluirInactivos=true` se
        devuelve de todos modos, pero eso exige un token de ADMIN.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
        - name: incluirInactivos
          in: query
          required: false
          description: >-
            Con `true` devuelve el álbum aunque esté dado de baja. **Requiere
            token con rol ADMIN**: sin él, la respuesta es 403.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: El álbum pedido, con sus imágenes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [Albums]
      summary: Modifica un álbum
      description: |
        **Requiere token con rol ADMIN.**

        Actualización parcial: se manda solo lo que cambia.

        - omitir un campo → queda como estaba
        - mandarlo en `null` → se borra (solo `descripcion` y `fecha`)
        - mandarlo en `""` → 400; para borrar se usa `null`

        **El `slug` no cambia aunque cambie el título**, a propósito: si
        cambiara, se romperían las URLs ya publicadas.

        Un álbum dado de baja devuelve 404: primero hay que reactivarlo.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumUpdateInput" }
      responses:
        "200":
          description: El álbum ya modificado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Albums]
      summary: Da de baja un álbum (baja lógica)
      description: |
        **Requiere token con rol ADMIN.**

        **Es también el switch de visibilidad pública.** No borra nada: la fila
        queda con `activo: false`, las fotos siguen en el servicio de imágenes
        y se recupera todo con `POST /albums/{id}/reactivar`.

        A partir de acá el álbum desaparece del listado público y su detalle
        devuelve 404, salvo para un ADMIN que pase `incluirInactivos=true`.

        Consecuencia a tener presente: **las fotos de un álbum dado de baja
        siguen ocupando espacio en la nube para siempre**. Para liberarlo hay
        que borrar las imágenes una por una con
        `DELETE /albums/{id}/imagenes/{imagenId}`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      responses:
        "204":
          description: Dado de baja. Sin body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: El álbum no existe o ya estaba dado de baja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /albums/{id}/reactivar:
    post:
      tags: [Albums]
      summary: Vuelve a mostrar un álbum dado de baja
      description: |
        **Requiere token con rol ADMIN.**

        Es idempotente: reactivar un álbum que ya estaba activo devuelve 200 y
        el álbum igual, sin error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      responses:
        "200":
          description: El álbum, ya activo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /albums/{id}/imagenes:
    post:
      tags: [Albums]
      summary: Sube fotos al álbum
      description: |
        **Requiere token con rol ADMIN.**

        `multipart/form-data`. Los archivos van en el campo **`imagenes`**; se
        pueden mandar varios en el mismo request.

        El backend recibe el archivo, lo sube al servicio de imágenes y guarda
        en la base **solo la URL**. El archivo nunca se guarda en el disco del
        servidor.

        Límites:

        | | |
        |---|---|
        | Tamaño por archivo | 5 MB (`413` si se pasa) |
        | Archivos por request | 5 (`400` si se pasa) |
        | Formatos | JPEG, PNG, WebP, AVIF |

        **La primera foto de un álbum sin portada queda de portada
        automáticamente**, para que el álbum no se vea vacío en el listado.

        Es todo o nada: si falla la subida de una, no se guarda ninguna y se
        limpia lo que ya se había subido.

        Devuelve el **álbum entero** y no solo las fotos nuevas, porque subir
        puede haber cambiado la portada y así el front se entera sin pedir el
        álbum de nuevo.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagenes]
              properties:
                imagenes:
                  type: array
                  description: De 1 a 5 archivos de imagen.
                  maxItems: 5
                  items:
                    type: string
                    format: binary
            encoding:
              imagenes:
                contentType: image/jpeg, image/png, image/webp, image/avif
      responses:
        "201":
          description: El álbum con las fotos ya cargadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetalle" }
        "400":
          description: >-
            No vino ningún archivo, el campo del formulario no se llama
            `imagenes`, el formato no está permitido o se mandaron más de 5.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            El álbum está dado de baja. Hay que reactivarlo antes de subirle
            fotos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502":
          description: El servicio de imágenes no respondió. No se guardó nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /albums/{id}/imagenes/{imagenId}:
    delete:
      tags: [Albums]
      summary: Borra una foto del álbum
      description: |
        **Requiere token con rol ADMIN.**

        **Es el único borrado físico del módulo**: saca la fila de la base *y*
        el archivo de la nube. No se puede deshacer.

        Si la foto era la portada, se promueve automáticamente la más antigua
        de las que quedan, así el álbum no se ve vacío en el listado.

        Devuelve 404 si la foto no pertenece a **ese** álbum, aunque exista en
        otro.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
        - name: imagenId
          in: path
          required: true
          description: cuid de la imagen
          schema: { type: string }
          example: clx9z8y7x6w5v4u3t2s1r0q9
      responses:
        "204":
          description: Borrada. Sin body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La imagen no existe en ese álbum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /albums/{id}/portada:
    patch:
      tags: [Albums]
      summary: Elige qué foto se muestra como portada
      description: |
        **Requiere token con rol ADMIN.**

        La imagen tiene que pertenecer a **ese** álbum: si el `imagenId` existe
        pero es de otro, devuelve 404 y la portada no cambia.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid del álbum
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortadaInput" }
      responses:
        "200":
          description: El álbum con la portada ya cambiada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlbumDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La imagen no existe en ese álbum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }


  /preinscripciones:
    post:
      tags: [Preinscripciones]
      summary: Crea una preinscripción a una carrera
      description: |
        **Endpoint público, sin token.** Es el formulario de la web: el
        aspirante todavía no es alumno y no tiene cuenta.

        El `carreraId` tiene que ser el de una carrera **activa**, y sale de
        `GET /carreras`. Si no existe devuelve 404; si esta dada de baja, 409.

        El **documento se normaliza** antes de guardarse: se le sacan puntos,
        espacios y guiones y se pasa a mayúsculas. Por eso `30.111.222` y
        `30111222` son el mismo documento y el segundo choca con el primero.

        **Una persona no puede preinscribirse dos veces a la misma carrera**
        (409), pero sí puede anotarse a varias carreras distintas.

        `fechaNacimiento` va **solo como fecha** (`1990-05-15`), no como
        datetime: una fecha de nacimiento no tiene hora, y mandar una obligaría
        a decidir en qué zona horaria interpretarla.
      responses:
        "201":
          description: |
            La preinscripción creada, con la carrera anidada.

            No trae header `Location`: no existe un `GET /preinscripciones/{id}`
            al que apuntar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preinscripcion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: La carrera indicada no existe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            La carrera está dada de baja, o ya hay una preinscripción con ese
            documento para esa carrera.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreinscripcionInput" }

    get:
      tags: [Preinscripciones]
      summary: Lista todas las preinscripciones
      description: |
        **Requiere token con rol ADMIN.**

        Es privado a propósito y no admite excepción: cada fila trae documento,
        fecha de nacimiento, domicilio y teléfono de una persona que ni
        siquiera es alumno todavía.

        Orden: de la más nueva a la más vieja.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Listado de preinscripciones (array vacío si no hay ninguna)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Preinscripcion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }


components:

  securitySchemes:
    # Es lo que valida `authenticate` en src/middlewares/auth.middleware.js.
    # Para probar endpoints protegidos desde la UI: boton "Authorize" y pegar
    # el token SIN el prefijo "Bearer " (la UI lo agrega sola).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # Un schema por entidad, a medida que se implementan. Convencion: `X` es
    # lo que devuelve la API y `XInput` lo que se recibe en el body.

    Sede:
      type: object
      description: Una sede del instituto.
      required: [id, nombre, ciudad, provincia, activa, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: cuid generado por la base.
          examples: ["clx1a2b3c4d5e6f7g8h9i0j1"]
        nombre:
          type: string
          examples: ["Sede Centro"]
        ciudad:
          type: string
          examples: ["Cordoba"]
        provincia:
          type: string
          examples: ["Cordoba"]
        direccion:
          type: [string, "null"]
          examples: ["Av. Colon 1234"]
        telefono:
          type: [string, "null"]
          examples: ["+54 351 4567890"]
        email:
          type: [string, "null"]
          format: email
          examples: ["centro@instituto.edu.ar"]
        activa:
          type: boolean
          description: >-
            `false` significa que la sede esta dada de baja. Por defecto esas
            sedes no aparecen ni en el listado ni en el detalle.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SedeInput:
      type: object
      description: >-
        Body para crear una sede. No acepta campos que no esten en esta lista:
        si mandas uno de mas, la respuesta es un 400.
      required: [nombre, ciudad, provincia]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Sede Centro"]
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Cordoba"]
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Cordoba"]
        direccion:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Av. Colon 1234"]
        telefono:
          type: string
          minLength: 1
          maxLength: 30
          examples: ["+54 351 4567890"]
        email:
          type: string
          format: email
          maxLength: 120
          examples: ["centro@instituto.edu.ar"]

    SedeUpdateInput:
      type: object
      description: >-
        Body del PATCH. Todos los campos son opcionales, pero hay que mandar al
        menos uno. Los tres opcionales aceptan `null` para borrar el valor. No
        acepta campos que no esten en esta lista.
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Sede Centro II"]
        ciudad:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Cordoba"]
        provincia:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Cordoba"]
        direccion:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          description: "`null` borra la direccion."
          examples: ["Av. Colon 1234"]
        telefono:
          type: [string, "null"]
          minLength: 1
          maxLength: 30
          description: "`null` borra el telefono."
          examples: ["+54 351 4567890"]
        email:
          type: [string, "null"]
          format: email
          maxLength: 120
          description: "`null` borra el email."
          examples: ["centro@instituto.edu.ar"]

    SedeDetalle:
      description: |
        Una sede con las carreras que se dictan en ella. Lo devuelve
        `GET /sedes/{id}`.

        Dos cosas a tener en cuenta:

        - Cada elemento de `carreras` viene **envuelto** en un objeto
          `{ carrera: ... }`. No es un array de carreras: es la tabla
          intermedia de la relacion N:M. Del lado del front:
          `sede.carreras.map(c => c.carrera)`.
        - **Incluye las carreras dadas de baja**, marcadas con
          `activa: false`. Filtrarlas es decision del front.
      allOf:
        - $ref: "#/components/schemas/Sede"
        - type: object
          required: [carreras]
          properties:
            carreras:
              type: array
              description: Ordenadas por nombre de la carrera.
              items:
                type: object
                required: [carrera]
                properties:
                  carrera: { $ref: "#/components/schemas/CarreraResumen" }

    Autoridad:
      type: object
      properties:
        id:
          type: string
          description: CUID de la autoridad
        nombre:
          type: string
        cargo:
          type: string
        imagen:
          type: string
          format: uri
        orden:
          type: integer
        descripcion:
          type: string

    InformacionInstitucional:
      type: object
      properties:
        id:
          type: string
          description: CUID de la información institucional
        sedeId:
          type: string
          description: CUID de la sede a la que pertenece
        nombre:
          type: string
        lema:
          type: string
        historia:
          type: string
        mision:
          type: string
        vision:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        autoridades:
          type: array
          items:
            $ref: "#/components/schemas/Autoridad"

    InformacionInstitucionalInput:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          example: Instituto Superior Villa del Rosario
        lema:
          type: string
        historia:
          type: string
        mision:
          type: string
        vision:
          type: string
        autoridades:
          type: array
          items:
            type: object
            required:
              - nombre
              - cargo
            properties:
              nombre:
                type: string
              cargo:
                type: string
              imagen:
                type: string
                format: uri
              orden:
                type: integer
              descripcion:
                type: string

    Carrera:
      type: object
      description: Una carrera disponible en el instituto.
      required:
        - id
        - nombre
        - slug
        - descripcion
        - duracionAnios
        - tituloOtorgado
        - modalidad
        - activa
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: cuid generado por la base.
          examples: ["clc1a2b3c4d5e6f7g8h9i0j1"]

        nombre:
          type: string
          examples: ["Tecnicatura Superior en Programacion"]

        slug:
          type: string
          examples: ["tecnicatura-superior-en-programacion"]

        descripcion:
          type: [string, "null"]
          examples: ["Carrera orientada al desarrollo de software."]

        duracionAnios:
          type: [integer, "null"]
          examples: [3]

        tituloOtorgado:
          type: [string, "null"]
          examples: ["Tecnico Superior en Programacion"]

        modalidad:
          type: string
          enum: [PRESENCIAL, VIRTUAL, HIBRIDA]

        activa:
          type: boolean
          description: >-
            `false` significa que la carrera esta dada de baja. Por defecto
            las carreras dadas de baja no aparecen en los endpoints publicos.

        imagenUrl:
          type: ["string", "null"]
          format: uri
          description: >-
            Imagen representativa de la carrera, servida por CDN. `null` si
            todavia no se le cargo ninguna. Se gestiona con
            `PUT` y `DELETE /carreras/{id}/imagen`: **no se puede setear desde
            el POST ni el PATCH**. Para una miniatura, insertar la
            transformacion en la URL (`/upload/w_400,q_auto,f_auto/`).
          examples: ["https://res.cloudinary.com/demo/image/upload/v1/instituto/albums/carreras/abc.jpg"]

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    CarreraResumen:
      type: object
      description: >-
        Version reducida de una Carrera, para cuando viaja anidada dentro de
        otro recurso. No trae `descripcion` ni los timestamps.
      required: [id, nombre, slug, modalidad, activa]
      properties:
        id:
          type: string
          examples: ["clc1a2b3c4d5e6f7g8h9i0j1"]
        nombre:
          type: string
          examples: ["Tecnicatura Superior en Programacion"]
        slug:
          type: string
          examples: ["tecnicatura-superior-en-programacion"]
        modalidad:
          type: string
          enum: [PRESENCIAL, VIRTUAL, HIBRIDA]
        duracionAnios:
          type: [integer, "null"]
          examples: [3]
        tituloOtorgado:
          type: [string, "null"]
          examples: ["Tecnico Superior en Programacion"]
        activa:
          type: boolean
          description: >-
            `false` significa que la carrera esta dada de baja. Viene igual en
            la respuesta.

    CarreraInput:
      type: object
      description: |
        Body del `POST /carreras`. No acepta campos de más (da 400).

        El `slug` y el `activa` los pone la API: no se mandan.
      required: [nombre, modalidad]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          examples: ["Tecnicatura Superior en Programacion"]
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
          examples: ["Carrera orientada al desarrollo de software."]
        duracionAnios:
          type: integer
          minimum: 1
          maximum: 15
          examples: [3]
        tituloOtorgado:
          type: string
          minLength: 1
          maxLength: 150
          examples: ["Tecnico Superior en Programacion"]
        modalidad:
          type: string
          enum: [PRESENCIAL, VIRTUAL, HIBRIDA]
        sedes:
          type: array
          description: >-
            cuids de las sedes donde se dicta. Opcional. Si alguno no existe,
            no se crea nada y devuelve 400. **No vuelve en la respuesta**: es
            un campo de solo escritura.
          items: { type: string }
          examples: [["clx1a2b3c4d5e6f7g8h9i0j1"]]

    CarreraUpdateInput:
      type: object
      description: |
        Body del `PATCH /carreras/{id}`. Al menos un campo, y no acepta campos
        de más.

        - omitir → queda como estaba
        - `null` → borra el valor (solo los opcionales)
        - `""` → 400; para borrar se usa `null`

        `slug` no se puede modificar y tampoco cambia solo al cambiar el
        nombre.
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        descripcion:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        duracionAnios:
          type: [integer, "null"]
          minimum: 1
          maximum: 15
        tituloOtorgado:
          type: [string, "null"]
          minLength: 1
          maxLength: 150
        modalidad:
          type: string
          enum: [PRESENCIAL, VIRTUAL, HIBRIDA]
        sedes:
          type: array
          description: >-
            **Reemplaza por completo** el conjunto de sedes asignadas, no
            agrega ni quita de a una. Mandar `[]` la deja sin ninguna.
          items: { type: string }

    Publicacion:
      type: object
      description: Noticia o evento del instituto.
      required: [id, titulo, slug, contenido, tipo, destacada, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: cuid generado por la base.
          examples: ["clx1a2b3c4d5e6f7g8h9i0j1"]
        titulo:
          type: string
          examples: ["Jornada de Inteligencia Artificial 2026"]
        slug:
          type: string
          description: Slug único generado a partir del título. Permanece estable aunque cambie el título.
          examples: ["jornada-de-inteligencia-artificial-2026"]
        resumen:
          type: [string, "null"]
          examples: ["Una jornada abierta para estudiantes."]
        contenido:
          type: string
          examples: ["Contenido completo de la noticia..."]
        tipo:
          type: string
          enum: [NOTICIA, EVENTO]
          examples: ["EVENTO"]
        imagenUrl:
          type: [string, "null"]
          format: uri
          examples: ["https://example.com/imagen.jpg"]
        fechaEvento:
          type: [string, "null"]
          format: date-time
          description: Solo para EVENTO. En NOTICIA siempre es null.
          examples: ["2026-10-20T18:00:00.000Z"]
        destacada:
          type: boolean
          description: Si es destacada aparece primero o resaltada en el front.
          examples: [true]
        autorId:
          type: [string, "null"]
          description: CUID del autor (usuario que creó la publicación). Null si fue eliminado.
        autor:
          type: ["object", "null"]
          description: Datos del autor sin información sensible. Solo id, nombre y apellido.
          properties:
            id:
              type: string
            nombre:
              type: string
            apellido:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicacionInput:
      type: object
      description: >-
        Body para crear una publicación. El slug se genera automáticamente. No acepta campos que no estén
        en esta lista: si mandás uno de más, la respuesta es 400. autorId no se envía, se toma del JWT.
      required: [titulo, contenido, tipo]
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Jornada de Inteligencia Artificial 2026"]
        resumen:
          type: string
          minLength: 1
          maxLength: 500
          examples: ["Una jornada abierta para estudiantes."]
        contenido:
          type: string
          minLength: 1
          examples: ["Contenido completo de la noticia..."]
        tipo:
          type: string
          enum: [NOTICIA, EVENTO]
          examples: ["EVENTO"]
        imagenUrl:
          type: string
          format: uri
          maxLength: 500
          examples: ["https://example.com/imagen.jpg"]
        fechaEvento:
          type: string
          format: date-time
          description: Obligatoria si tipo=EVENTO. Debe ser null o omitirse si tipo=NOTICIA.
          examples: ["2026-10-20T18:00:00.000Z"]
        destacada:
          type: boolean
          default: false
          examples: [true]

    PublicacionUpdateInput:
      type: object
      description: >-
        Body del PATCH. Todos los campos son opcionales, pero hay que mandar al menos uno.
        resumen e imagenUrl aceptan `null` para borrar el valor. No acepta campos que no estén en esta lista.
        Regla tipo/fechaEvento se valida sobre el estado final: EVENTO requiere fechaEvento, NOTICIA fuerza null.
      minProperties: 1
      additionalProperties: false
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Jornada de Inteligencia Artificial 2026 - Actualizado"]
        resumen:
          type: [string, "null"]
          minLength: 1
          maxLength: 500
          description: "`null` borra el resumen."
          examples: ["Resumen actualizado."]
        contenido:
          type: string
          minLength: 1
          examples: ["Contenido actualizado..."]
        tipo:
          type: string
          enum: [NOTICIA, EVENTO]
          examples: ["NOTICIA"]
        imagenUrl:
          type: [string, "null"]
          format: uri
          maxLength: 500
          description: "`null` borra la imagen."
          examples: ["https://example.com/nueva-imagen.jpg"]
        fechaEvento:
          type: [string, "null"]
          format: date-time
          description: "`null` borra la fecha (solo válido si el estado final es NOTICIA)."
          examples: ["2026-11-15T18:00:00.000Z"]
        destacada:
          type: boolean
          examples: [false]

    Imagen:
      type: object
      description: |
        Una foto de un álbum. `url` es lo único que necesita el front; el
        identificador interno del servicio de imágenes no se expone, porque
        borrar es cosa de la API.
      required: [id, url, createdAt]
      properties:
        id: { type: string, example: clx9z8y7x6w5v4u3t2s1r0q9 }
        url:
          type: string
          format: uri
          description: URL pública de la imagen, servida por CDN.
          example: https://res.cloudinary.com/demo/image/upload/v1/instituto/albums/clx1a2/foto.jpg
        width:
          type: [integer, "null"]
          description: >-
            Ancho en píxeles. Sirve para que el front reserve el espacio antes
            de que cargue la foto y evite el salto de layout.
          example: 1600
        height:
          type: [integer, "null"]
          example: 1067
        formato:
          type: [string, "null"]
          example: jpg
        bytes:
          type: [integer, "null"]
          description: Peso del archivo original.
          example: 482913
        createdAt: { type: string, format: date-time }

    Album:
      type: object
      description: |
        Un álbum tal como sale en el **listado**: con su portada y el total de
        fotos, pero sin el array completo. Para las fotos, `AlbumDetalle`.
      required: [id, titulo, slug, activo, cantidadImagenes, createdAt, updatedAt]
      properties:
        id: { type: string, example: clx1a2b3c4d5e6f7g8h9i0j1 }
        titulo: { type: string, example: Acto de colación 2026 }
        slug:
          type: string
          description: >-
            Se genera del título y no se puede elegir ni modificar. Si el
            título se repite se agrega un sufijo (`-2`, `-3`, ...).
          example: acto-de-colacion-2026
        descripcion:
          type: [string, "null"]
          example: Fotos del acto de colación de la promoción 2026.
        fecha:
          type: [string, "null"]
          format: date-time
          description: Fecha del evento que retrata el álbum, no la de carga.
          example: "2026-08-15T18:00:00.000Z"
        activo:
          type: boolean
          description: >-
            Si es `false` el álbum está dado de baja: no aparece en el listado
            público y su detalle devuelve 404.
          example: true
        portadaId: { type: [string, "null"] }
        portada:
          description: La foto que se muestra en el listado. `null` si el álbum no tiene fotos.
          oneOf:
            - $ref: "#/components/schemas/Imagen"
            - type: "null"
        cantidadImagenes:
          type: integer
          description: Total de fotos del álbum.
          example: 24
        autorId: { type: [string, "null"] }
        autor:
          description: Quién lo creó. `null` si el usuario fue eliminado.
          oneOf:
            - type: object
              properties:
                id: { type: string }
                nombre: { type: string }
                apellido: { type: string }
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AlbumDetalle:
      description: |
        Lo mismo que `Album` más el array completo de `imagenes`, ordenado por
        fecha de subida. Es lo que devuelve el detalle y todas las escrituras.
      allOf:
        - $ref: "#/components/schemas/Album"
        - type: object
          required: [imagenes]
          properties:
            imagenes:
              type: array
              items: { $ref: "#/components/schemas/Imagen" }

    AlbumInput:
      type: object
      description: |
        Body del POST. Solo metadatos: las fotos van por
        `POST /albums/{id}/imagenes`.

        No acepta campos de más (da 400). `slug`, `activo` y el autor los pone
        la API.
      required: [titulo]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          example: Acto de colación 2026
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
          example: Fotos del acto de colación de la promoción 2026.
        fecha:
          type: string
          format: date-time
          description: Fecha del evento, en ISO 8601 con offset.
          example: "2026-08-15T18:00:00.000Z"

    AlbumUpdateInput:
      type: object
      description: |
        Body del PATCH. Al menos un campo, y no acepta campos de más.

        - omitir → queda como estaba
        - `null` → borra el valor
        - `""` → 400; para borrar se usa `null`

        `slug` no se puede modificar y tampoco cambia solo al cambiar el título.
      minProperties: 1
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
        descripcion:
          type: [string, "null"]
          minLength: 1
          maxLength: 2000
        fecha:
          type: [string, "null"]
          format: date-time

    PortadaInput:
      type: object
      description: Body del PATCH /albums/{id}/portada.
      required: [imagenId]
      properties:
        imagenId:
          type: string
          description: cuid de una imagen **de ese mismo álbum**.
          example: clx9z8y7x6w5v4u3t2s1r0q9

    Preinscripcion:
      type: object
      description: |
        Una preinscripción de un aspirante a una carrera. Contiene datos
        personales, por eso el listado es solo para ADMIN.
      required:
        [id, nombre, apellido, documento, fechaNacimiento, nacionalidad,
         direccion, localidad, provincia, telefono, email, carreraId,
         createdAt, updatedAt]
      properties:
        id: { type: string, examples: ["clp1a2b3c4d5e6f7g8h9i0j1"] }
        nombre: { type: string, examples: ["Ana"] }
        apellido: { type: string, examples: ["Perez"] }
        documento:
          type: string
          description: >-
            Normalizado: sin puntos, espacios ni guiones, en mayúsculas. Se
            devuelve tal como quedó guardado, no como se escribió.
          examples: ["30111222"]
        fechaNacimiento:
          type: string
          format: date
          description: Solo la fecha, sin hora ni zona horaria.
          examples: ["1995-03-20"]
        nacionalidad: { type: string, examples: ["Argentina"] }
        direccion: { type: string, examples: ["San Martin 450"] }
        localidad: { type: string, examples: ["Rio Cuarto"] }
        provincia: { type: string, examples: ["Cordoba"] }
        telefono: { type: string, examples: ["+54 358 4123456"] }
        email:
          type: string
          format: email
          description: Se guarda en minúsculas.
          examples: ["ana.perez@example.com"]
        carreraId: { type: string, examples: ["clc1a2b3c4d5e6f7g8h9i0j1"] }
        carrera:
          description: La carrera a la que se anotó, en su versión reducida.
          $ref: "#/components/schemas/CarreraResumen"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PreinscripcionInput:
      type: object
      description: |
        Body del POST. Todos los campos son obligatorios y no acepta campos de
        más (da 400).

        El `id`, las fechas de auditoría y la forma normalizada del documento
        los pone la API.
      required:
        [nombre, apellido, documento, fechaNacimiento, nacionalidad, direccion,
         localidad, provincia, telefono, email, carreraId]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 80, examples: ["Ana"] }
        apellido: { type: string, minLength: 1, maxLength: 80, examples: ["Perez"] }
        documento:
          type: string
          minLength: 6
          maxLength: 20
          pattern: "^[0-9A-Za-z.\\-\\s]+$"
          description: >-
            Admite letras a propósito: no todo aspirante tiene DNI argentino
            (pasaporte, cédula de otro país). Se puede escribir con puntos; se
            guarda sin ellos.
          examples: ["30.111.222"]
        fechaNacimiento:
          type: string
          format: date
          description: >-
            `YYYY-MM-DD`. Un datetime completo da 400. No puede ser futura ni
            de hace más de 120 años.
          examples: ["1995-03-20"]
        nacionalidad: { type: string, minLength: 1, maxLength: 60, examples: ["Argentina"] }
        direccion: { type: string, minLength: 1, maxLength: 150, examples: ["San Martin 450"] }
        localidad: { type: string, minLength: 1, maxLength: 80, examples: ["Rio Cuarto"] }
        provincia: { type: string, minLength: 1, maxLength: 80, examples: ["Cordoba"] }
        telefono:
          type: string
          minLength: 7
          maxLength: 25
          pattern: "^[0-9+\\-()\\s]+$"
          examples: ["+54 358 4123456"]
        email:
          type: string
          format: email
          maxLength: 150
          examples: ["ana.perez@example.com"]
        carreraId:
          type: string
          description: >-
            cuid de una carrera **activa**. El front lo saca de `GET /carreras`,
            que es publico y ya devuelve solo las activas: sirve tal cual para
            llenar el desplegable del formulario. Si la carrera no existe da
            404, y si esta dada de baja, 409.
          examples: ["clc1a2b3c4d5e6f7g8h9i0j1"]

    MensajeContacto:
      type: object
      description: Un mensaje enviado desde el formulario de contacto.
      required: [id, nombre, email, mensaje, estado, createdAt]
      properties:
        id:
          type: string
          description: cuid generado por la base.
          examples: ["clx1a2b3c4d5e6f7g8h9i0j1"]
        nombre:
          type: string
          examples: ["Maria Gomez"]
        email:
          type: string
          format: email
          examples: ["maria.gomez@example.com"]
        telefono:
          type: [string, "null"]
          examples: ["+54 351 4567890"]
        asunto:
          type: [string, "null"]
          examples: ["Consulta sobre inscripcion"]
        mensaje:
          type: string
          examples: ["Queria saber si todavia estan abiertas las inscripciones para el ciclo 2026."]
        estado:
          type: string
          enum: [NO_LEIDO, LEIDO, RESPONDIDO]
          description: >-
            Nace en `NO_LEIDO`. Pasa a `RESPONDIDO` automaticamente en cuanto
            se carga una `respuesta` por primera vez.
        respuesta:
          type: [string, "null"]
          description: Texto de la respuesta del admin. Null hasta que se responde.
          examples: ["Hola Maria, si, las inscripciones siguen abiertas hasta fin de mes."]
        respondidoAt:
          type: [string, "null"]
          format: date-time
          description: Se fija automaticamente al cargar la primera respuesta. Null hasta entonces.
        createdAt:
          type: string
          format: date-time

    MensajeContactoInput:
      type: object
      description: >-
        Body del POST /contacto. Es el formulario publico: no incluye
        `estado`, siempre nace en `NO_LEIDO`. No acepta campos que no esten en
        esta lista.
      required: [nombre, email, mensaje]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Maria Gomez"]
        email:
          type: string
          format: email
          maxLength: 120
          examples: ["maria.gomez@example.com"]
        telefono:
          type: string
          minLength: 1
          maxLength: 30
          examples: ["+54 351 4567890"]
        asunto:
          type: string
          minLength: 1
          maxLength: 150
          examples: ["Consulta sobre inscripcion"]
        mensaje:
          type: string
          minLength: 1
          maxLength: 2000
          examples: ["Queria saber si todavia estan abiertas las inscripciones para el ciclo 2026."]

    MensajeContactoUpdateInput:
      type: object
      description: >-
        Body del PATCH /contacto/{id}. Todos los campos son opcionales, pero
        hay que mandar al menos uno. No acepta campos que no esten en esta
        lista.
      minProperties: 1
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [NO_LEIDO, LEIDO, RESPONDIDO]
          description: >-
            Se puede setear a mano, por ejemplo para marcar `LEIDO` sin
            responder todavia.
          examples: ["LEIDO"]
        respuesta:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Si el mensaje no tenia una respuesta previa, cargarla fuerza
            `estado = RESPONDIDO` y fija `respondidoAt`, aunque en el mismo
            body se haya mandado otro `estado`.
          examples: ["Hola Maria, si, las inscripciones siguen abiertas hasta fin de mes."]

    Usuario:
      type: object
      properties:
        id:
          type: string
          description: CUID del usuario
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        dni:
          type: string
        rol:
          type: string
          enum: [ADMIN, USUARIO]
        activo:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CrearUsuarioInput:
      type: object
      required:
        - nombre
        - apellido
        - email
        - dni
        - password
      properties:
        nombre:
          type: string
          example: Juan
        apellido:
          type: string
          example: Perez
        email:
          type: string
          format: email
          example: juan.perez@test.com
        dni:
          type: string
          example: 40123456
        password:
          type: string
          format: password
          minLength: 8
          example: 12345678

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: juan.perez@test.com
        password:
          type: string
          format: password
          example: 12345678

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            usuario:
              $ref: "#/components/schemas/Usuario"

    LogoutInput:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token de la sesión

    RecuperarPasswordInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: juan.perez@test.com

    RecuperarPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: Token de recuperación generado
            token:
              type: string

    ResetPasswordInput:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 8

    ActualizarPerfilInput:
      type: object
      properties:
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        dni:
          type: string

    CambiarRolInput:
      type: object
      required:
        - rol
      properties:
        rol:
          type: string
          enum: [ADMIN, USUARIO]

    UsuarioResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/Usuario"

    UsuariosResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Usuario"

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    Error:
      type: object
      description: Forma de cualquier respuesta de error de la API.
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          description: Descripcion del error, apta para mostrar al usuario.
          examples: ["El registro solicitado no existe"]
        details:
          description: Informacion extra. Solo aparece en algunos errores.
        stack:
          type: string
          description: >-
            Traza del error. SOLO se incluye cuando NODE_ENV=development;
            en produccion nunca se expone.

    ValidationIssue:
      type: object
      description: Un campo que no paso la validacion de Zod.
      required: [source, field, message]
      properties:
        source:
          type: string
          enum: [body, params, query]
          description: En que parte del request estaba el campo.
        field:
          type: string
          examples: ["email"]
        message:
          type: string
          examples: ["Invalid email address"]

    ValidationError:
      type: object
      description: >-
        Error 400 devuelto por el middleware `validate()`. A diferencia del
        resto, `details` trae la lista de campos que fallaron.
      required: [success, message, details]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          examples: ["Datos de entrada invalidos"]
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

  responses:

    # Respuestas comunes a todos los endpoints. Se referencian asi:
    #   "404": { $ref: "#/components/responses/NotFound" }

    BadRequest:
      description: Los datos enviados no pasaron la validacion.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    Unauthorized:
      description: Falta el token, es invalido, expiro o la cuenta esta desactivada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Autenticado, pero el rol no alcanza para esta accion.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: El recurso no existe.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: >-
        Choca con un registro existente: campo unico duplicado (Prisma P2002) o
        una relacion que impide la operacion (P2003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    PayloadTooLarge:
      description: >-
        Algun archivo supera el limite de 5 MB. No se guardo ninguno.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
