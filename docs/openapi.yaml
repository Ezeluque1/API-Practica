# ============================================================================
# Documentacion de la API - OpenAPI 3.1
#
# TODA la documentacion se escribe en ESTE archivo, nunca en los routers.
# Los routers quedan solo con logica de ruteo.
#
# Se ve en:  http://localhost:3000/api/docs                (local)
#            https://api-instituto.onrender.com/api/docs   (produccion)
#
# Al agregar un endpoint: sumar su tag en `tags` y su ruta en `paths`.
# Abajo de `paths` hay un ejemplo completo comentado para copiar y pegar.
# ============================================================================

openapi: 3.1.0

info:
  title: API Instituto
  version: 1.0.0
  description: |
    API REST del Instituto.

    ### Forma de las respuestas

    **En exito el body es el recurso pelado**, sin ningun sobre: un objeto en
    las respuestas de un recurso y un array en los listados. Un listado vacio
    devuelve `200 []`, nunca un 404. Un `DELETE` devuelve `204` sin body.

    **En error** el body es un objeto `{ success: false, message, details? }`,
    igual para todos los endpoints porque sale del manejador centralizado
    (`src/middlewares/error.middleware.js`).

    Son formas distintas a proposito: para saber si algo salio bien mirá el
    **status HTTP**, no una propiedad del body.

    Las respuestas de error estan definidas una sola vez en
    `components/responses`: no las redefinas, usalas con `$ref`.

servers:
  - url: https://api-instituto.onrender.com/api
    description: Produccion
  - url: http://localhost:3000/api
    description: Desarrollo local

# Un tag por recurso. Agrupa los endpoints en la UI y define el orden en que
# aparecen.
tags:
  - name: Sedes
    description: Sedes donde se dictan las carreras
  - name: Carreras
    description: Carreras disponibles en el instituto
  - name: Informacion Institucional
    description: Información institucional de cada sede, con sus autoridades
  - name: Usuarios
    description: Autenticación, perfil y administración de usuarios
  - name: Publicaciones
    description: Noticias y eventos del instituto
  - name: Contacto
    description: Mensajes recibidos desde el formulario de contacto
  - name: Albums
    description: Galerias de fotos del instituto
  - name: Preinscripciones
    description: Aspirantes que se anotan a una carrera desde la web

# Las rutas se escriben SIN el prefijo `/api`: ya esta incluido en `servers`.
# Es decir, el endpoint GET /api/sedes se documenta aca como `/sedes`.
#
# `/sedes` es la referencia a copiar para los recursos que falten.
paths:

  /sedes:
    get:
      tags: [Sedes]
      security:
        # Auth opcional: el endpoint es publico, pero si llega un token se usa
        # (lo necesita `incluirInactivas`). El `{}` es lo que lo marca como
        # opcional; sin la lista entera, Swagger UI NO manda el token aunque
        # hayas apretado Authorize, y el request sale anonimo.
        - {}
        - bearerAuth: []
      summary: Lista todas las sedes
      description: |
        Devuelve todas las sedes ordenadas por nombre. Si no hay ninguna
        devuelve `[]`, nunca un 404.

        **No incluye las carreras**: para eso esta `GET /sedes/{id}`.

        Por defecto trae **solo las sedes activas**. El endpoint es publico;
        solo `incluirInactivas=true` exige un token de ADMIN.

        ### Busqueda

        Con `buscar` se filtra por **ciudad o provincia**: alcanza con que
        matchee cualquiera de las dos. Es una coincidencia **parcial y sin
        distinguir mayusculas**, asi que `cor` encuentra `Cordoba`.

        Dos limites a tener presentes:

        - **No ignora tildes**: `Cordoba` no encuentra `Cordoba` escrito con
          acento. Resolverlo requiere la extension `unaccent` de Postgres.
        - Un `buscar` vacio o con solo espacios **equivale a no filtrar**, no
          es un error: asi un input de busqueda puede mandar el parametro
          siempre, aunque este vacio.
      parameters:
        - name: buscar
          in: query
          required: false
          description: >-
            Filtra por ciudad o provincia. Coincidencia parcial, sin distinguir
            mayusculas, sensible a tildes. Vacio equivale a no filtrar.
          schema:
            type: string
            maxLength: 80
          example: cordoba
        - name: incluirInactivas
          in: query
          required: false
          description: >-
            Con `true` incluye tambien las sedes dadas de baja. **Requiere token
            con rol ADMIN**: sin el, la respuesta es 403. Por defecto quedan
            invisibles. Solo se aceptan los valores `true` y `false`; cualquier
            otro da 400.
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "200":
          description: Listado de sedes (array vacio si no hay ninguna)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sede" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [Sedes]
      summary: Crea una sede
      description: |
        No puede haber dos sedes con el mismo `nombre` en la misma `ciudad`.
        Los textos se recortan (trim) antes de guardarse.

        **Requiere token con rol ADMIN.**
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SedeInput" }
      responses:
        "201":
          description: Sede creada
          headers:
            Location:
              description: URL de la sede recien creada
              schema: { type: string }
              example: /api/sedes/clx1a2b3c4d5e6f7g8h9i0j1
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sede" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            Ya existe una sede con ese nombre en esa ciudad. Hay dos casos y el
            `message` los distingue:

            - Choca con una sede **activa**: no se puede crear otra igual.
            - Choca con una sede **dada de baja**: la fila sigue ocupando su
              lugar en el indice unico. En ese caso `details.sedeId` trae el id
              de esa sede, para poder ofrecer reactivarla en vez de crear una
              nueva.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sedes/{id}:
    get:
      tags: [Sedes]
      security:
        # Auth opcional: el endpoint es publico, pero si llega un token se usa
        # (lo necesita `incluirInactivas`). El `{}` es lo que lo marca como
        # opcional; sin la lista entera, Swagger UI NO manda el token aunque
        # hayas apretado Authorize, y el request sale anonimo.
        - {}
        - bearerAuth: []
      summary: Obtiene una sede por id, con sus carreras
      description: |
        A diferencia del listado, el detalle incluye las carreras que se
        dictan en la sede.

        Una sede **dada de baja devuelve 404**, igual que si no existiera. Con
        `incluirInactivas=true` se devuelve de todos modos, pero eso exige un
        token de ADMIN.

        El endpoint en si es publico.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la sede
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
        - name: incluirInactivas
          in: query
          required: false
          description: >-
            Con `true` incluye tambien las sedes dadas de baja. **Requiere token
            con rol ADMIN**: sin el, la respuesta es 403. Por defecto quedan
            invisibles. Solo se aceptan los valores `true` y `false`; cualquier
            otro da 400.
          schema:
            type: string
            enum: ["true", "false"]
            default: "false"
      responses:
        "200":
          description: La sede pedida, con sus carreras
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SedeDetalle" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [Sedes]
      summary: Modifica una sede
      description: |
        Actualizacion **parcial**: se manda solo lo que cambia. Hay que enviar
        al menos un campo, un body vacio es un 400.

        Los tres casos que conviene tener claros:

        | Lo que mandas | Que pasa |
        |---|---|
        | omitis el campo | queda como estaba |
        | `"telefono": null` | se borra el valor |
        | `"telefono": ""` | **400** — para borrar se usa `null` |

        `nombre`, `ciudad` y `provincia` son obligatorios en la base: no se
        pueden poner en `null`, aunque si cambiar por otro valor.

        Los textos se recortan (trim) antes de guardarse. La respuesta es la
        sede sola, **sin** las carreras.

        **No se puede editar una sede dada de baja**: devuelve 404. Primero hay
        que reactivarla.

        **Requiere token con rol ADMIN.**
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la sede
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SedeUpdateInput" }
      responses:
        "200":
          description: La sede ya modificada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sede" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            El cambio dejaria dos sedes con el mismo nombre en la misma ciudad.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Sedes]
      summary: Da de baja una sede
      description: |
        **Baja logica**: la sede no se borra de la base, se marca con
        `activa: false`. Sus vinculos con carreras se conservan, que es lo que
        permite reactivarla despues sin perder nada.

        A partir de la baja deja de aparecer en el listado y en el detalle,
        salvo que se pida `incluirInactivas=true`.

        Sobre una sede **que ya estaba dada de baja devuelve 404**, no 204: es
        la contracara de que una sede dada de baja sea invisible.

        **Requiere token con rol ADMIN.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la sede
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      responses:
        "204":
          description: Dada de baja. Sin body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La sede no existe o ya estaba dada de baja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sedes/{id}/reactivar:
    post:
      tags: [Sedes]
      summary: Reactiva una sede dada de baja
      description: |
        Deshace la baja logica: vuelve a poner `activa: true`.

        Es **idempotente**: sobre una sede que ya estaba activa devuelve 200 y
        la sede, sin error. El front no necesita chequear el estado antes.

        **Requiere token con rol ADMIN.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la sede
          schema: { type: string }
          example: clx1a2b3c4d5e6f7g8h9i0j1
      responses:
        "200":
          description: La sede, ya activa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sede" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /sedes/{sedeId}/informacion-institucional:
    get:
      tags: [Informacion Institucional]
      summary: Ver la información institucional de una sede
      parameters:
        - name: sedeId
          in: path
          required: true
          schema: { type: string }
          description: CUID de la sede
      responses:
        "200":
          description: Información institucional de la sede
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InformacionInstitucional" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [Informacion Institucional]
      summary: Crear la información institucional de una sede
      description: Solo disponible para administradores.
      security:
        - bearerAuth: []
      parameters:
        - name: sedeId
          in: path
          required: true
          schema: { type: string }
          description: CUID de la sede
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InformacionInstitucionalInput" }
      responses:
        "201":
          description: Información institucional creada correctamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InformacionInstitucional" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

    put:
      tags: [Informacion Institucional]
      summary: Actualizar la información institucional de una sede
      description: Solo disponible para administradores. Reemplaza el recurso completo.
      security:
        - bearerAuth: []
      parameters:
        - name: sedeId
          in: path
          required: true
          schema: { type: string }
          description: CUID de la sede
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InformacionInstitucionalInput" }
      responses:
        "200":
          description: Información institucional actualizada correctamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InformacionInstitucional" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /usuarios/registro:
    post:
      tags: [Usuarios]
      summary: Registrar un nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearUsuarioInput"
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /carreras:
    get:
      tags: [Carreras]
      summary: Lista todas las carreras
      description: |
        Devuelve todas las carreras activas ordenadas por nombre. Si no hay
        ninguna devuelve `[]`, nunca un 404.

        Permite buscar por nombre y filtrar por modalidad o sede.

        Es el endpoint que alimenta el desplegable del formulario de
        preinscripcion: el `id` de cada carrera de aca es el `carreraId` que
        espera `POST /preinscripciones`. Como ya filtra las dadas de baja,
        cualquier opcion de esta lista sirve para preinscribirse.
      parameters:
        - name: buscar
          in: query
          required: false
          description: >-
            Filtra por nombre. Coincidencia parcial y sin distinguir
            mayusculas. Vacio equivale a no filtrar.
          schema:
            type: string
            maxLength: 80
          example: software

        - name: modalidad
          in: query
          required: false
          description: Filtra por modalidad de cursado.
          schema:
            type: string
            enum: [PRESENCIAL, VIRTUAL, HIBRIDA]

        - name: sede
          in: query
          required: false
          description: Filtra las carreras que se dictan en la sede indicada.
          schema:
            type: string
          example: clx1a2b3c4d5e6f7g8h9i0j1

      responses:
        "200":
          description: Listado de carreras (array vacio si no hay ninguna)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Carrera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

    post:
      tags: [Carreras]
      summary: Crea una carrera
      description: |
        **Requiere token con rol ADMIN.**

        El `slug` se genera solo a partir del nombre y **no se puede elegir**.
        Si el nombre se repite, se le agrega un sufijo (`-2`, `-3`, ...).

        En `sedes` van los ids de las sedes donde se dicta. Es opcional: se
        puede crear la carrera sin sedes y vincularlas después con un PATCH.
        Si alguno de los ids no existe, **no se crea nada** y devuelve 400.

        Ojo: la respuesta **no incluye** las sedes. `carreraPublicSelect` no
        las trae, así que `sedes` es un campo de solo escritura. Para saber qué
        carreras se dictan en una sede hay que ir por `GET /sedes/{id}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarreraInput" }
      responses:
        "201":
          description: La carrera creada. El header `Location` apunta al recurso.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrera" }
        "400":
          description: >-
            El body es inválido, o alguna de las sedes indicadas no existe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /carreras/{id}:
    get:
      tags: [Carreras]
      summary: Obtiene una carrera por id
      description: Devuelve el detalle de una carrera activa. Una carrera dada de baja devuelve 404, igual que si no existiera. El endpoint es publico.
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la carrera
          schema: { type: string }
          example: clc1a2b3c4d5e6f7g8h9i0j1
      responses:
        "200":
          description: La carrera pedida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

    patch:
      tags: [Carreras]
      summary: Modifica una carrera
      description: |
        **Requiere token con rol ADMIN.**

        Actualización parcial: se manda solo lo que cambia.

        - omitir un campo → queda como estaba
        - mandarlo en `null` → se borra (solo los opcionales)
        - mandarlo en `""` → 400; para borrar se usa `null`

        **El `slug` no se puede editar** y tampoco cambia solo al cambiar el
        nombre, para no romper URLs que ya lo referencien.

        Si viene `sedes`, **reemplaza por completo** el conjunto de sedes
        asignadas: no agrega ni quita de a una. Mandar `[]` la deja sin
        ninguna.

        Una carrera **dada de baja devuelve 404** y no se puede modificar. Hoy
        no hay endpoint para reactivarla.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la carrera
          schema: { type: string }
          example: clc1a2b3c4d5e6f7g8h9i0j1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarreraUpdateInput" }
      responses:
        "200":
          description: La carrera ya modificada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrera" }
        "400":
          description: >-
            El body es inválido, vino vacío, o alguna de las sedes indicadas no
            existe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La carrera no existe o está dada de baja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Carreras]
      summary: Da de baja una carrera (baja lógica)
      description: |
        **Requiere token con rol ADMIN.**

        No borra nada: la fila queda con `activa: false`. A partir de acá la
        carrera desaparece de `GET /carreras`, su detalle devuelve 404 y **no
        se puede preinscribir gente a ella** (`POST /preinscripciones` da 409).

        Los vínculos con sedes y las preinscripciones que ya existían se
        conservan.

        **Es irreversible desde la API**: hoy no hay endpoint para reactivar
        una carrera dada de baja, a diferencia de sedes y álbumes.

        Para borrarla de verdad está `DELETE /carreras/{id}/definitivo`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la carrera
          schema: { type: string }
          example: clc1a2b3c4d5e6f7g8h9i0j1
      responses:
        "204":
          description: Dada de baja. Sin body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La carrera no existe o ya estaba dada de baja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /carreras/{id}/imagen:
    put:
      tags: [Carreras]
      summary: Carga o reemplaza la imagen de la carrera
      description: |
        **Requiere token con rol ADMIN.**

        `multipart/form-data`. El archivo va en el campo **`imagen`**, uno solo.

        Sirve para **cargar y para reemplazar**: si la carrera ya tenía imagen,
        la nueva la pisa y la anterior se borra del servicio de imágenes. El
        front no necesita averiguar antes si había una.

        El backend recibe el archivo, lo sube a la nube y guarda en la base
        **solo la URL**. El archivo nunca toca el disco del servidor.

        | | |
        |---|---|
        | Tamaño máximo | 5 MB (`413` si se pasa) |
        | Archivos | 1 (`400` si vienen más) |
        | Formatos | JPEG, PNG, WebP, AVIF |

        Devuelve la **carrera entera**, así el front se entera del `imagenUrl`
        nuevo sin pedirla de nuevo.

        **Las miniaturas no hay que generarlas**: se piden sobre la misma URL
        insertando transformaciones, igual que en álbumes. Para una tarjeta de
        400px: `.../upload/w_400,q_auto,f_auto/...`. No consume espacio extra.

        Una carrera **dada de baja devuelve 404**, igual que el `PATCH`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la carrera
          schema: { type: string }
          example: clc1a2b3c4d5e6f7g8h9i0j1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen]
              properties:
                imagen:
                  type: string
                  format: binary
                  description: Un archivo de imagen, hasta 5 MB.
            encoding:
              imagen:
                contentType: image/jpeg, image/png, image/webp, image/avif
      responses:
        "200":
          description: La carrera con su `imagenUrl` ya actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrera" }
        "400":
          description: >-
            No vino ningún archivo, el campo del formulario no se llama
            `imagen`, vinieron dos o más, o el formato no está permitido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: La carrera no existe o está dada de baja.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "502":
          description: El servicio de imágenes no respondió. No se guardó nada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

    delete:
      tags: [Carreras]
      summary: Saca la imagen de la carrera
      description: |
        **Requiere token con rol ADMIN.**

        Deja `imagenUrl` en `null` y **borra el archivo de la nube**. No se
        puede deshacer: para cambiarla por otra conviene usar el `PUT`, que
        hace las dos cosas de una.

        Si la carrera no tiene imagen devuelve 404, igual que
        `DELETE /albums/{id}/imagenes/{imagenId}`.

        Devuelve la carrera, no un 204, para que el front vea el `imagenUrl` ya
        en `null`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la carrera
          schema: { type: string }
          example: clc1a2b3c4d5e6f7g8h9i0j1
      responses:
        "200":
          description: La carrera, ya sin imagen
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Carrera" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            La carrera no existe, está dada de baja, o no tiene imagen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }

  /carreras/{id}/definitivo:
    delete:
      tags: [Carreras]
      summary: Elimina una carrera definitivamente
      description: |
        **Requiere token con rol ADMIN.**

        Borrado físico: la fila desaparece de la base y **no se puede
        deshacer**. Los vínculos en `CarreraSede` se borran solos en cascada.

        **No funciona si la carrera tiene preinscripciones**: esa relación es
        `onDelete: Restrict`, así que la base frena el borrado y devuelve 409
        diciendo cuántas hay. Es a propósito — borrarlas en cascada haría
        desaparecer en silencio los datos de aspirantes reales. Si el objetivo
        es sacarla del sitio, la baja lógica (`DELETE /carreras/{id}`) hace eso
        sin perder nada.

        A diferencia del PATCH, este endpoint **sí** funciona sobre una carrera
        ya dada de baja.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: cuid de la carrera
          schema: { type: string }
          example: clc1a2b3c4d5e6f7g8h9i0j1
      responses:
        "204":
          description: Eliminada. Sin body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            La carrera tiene preinscripciones asociadas. No se borró nada.

            `details.preinscripciones` trae cuántas son.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                conPreinscripciones:
                  value:
                    success: false
                    message: >-
                      No se puede eliminar la carrera: tiene 3 preinscripciones
                      asociadas. Usa la baja logica (DELETE /carreras/:id) para
                      ocultarla sin perder los datos de los aspirantes.
                    details:
                      preinscripciones: 3
        "500": { $ref: "#/components/responses/InternalError" }

