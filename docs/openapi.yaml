        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /contacto/{id}:
    get:
      tags: [Contacto]
      summary: Obtiene un mensaje de contacto por id
      description: |
        **Requiere token con rol ADMIN.**
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
